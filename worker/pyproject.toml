[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents[meta,google,silero,images]>=1.8.10",
    "livekit-plugins-anam>=1.8.10",
    "livekit-plugins-google>=1.8.10",
    "livekit-plugins-inworld>=1.8.10",
    "numpy>=2.5.4",
    "openai>=1.60.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
